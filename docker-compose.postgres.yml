services:
  postgres:
    image: postgres:16
    container_name: roman_ingestion_postgres
    environment:
      POSTGRES_DB: roman_ingestion
      POSTGRES_USER: roman
      POSTGRES_PASSWORD: roman
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roman -d roman_ingestion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

